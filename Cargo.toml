[package]
name = "languages"
version = "0.0.2"
edition = "2024"
build = "build.rs"

authors = ["Aldo Cortesi <aldo@corte.si>"]
description = "GitHub's language data, compiled into a tiny, fast Rust library"
license = "MIT"
repository = "https://github.com/cortesi/languages"
keywords = ["linguist", "languages", "github"]

[dependencies]
once_cell = "1.18"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[workspace.metadata.nanocode]
schema-version = 1
requires-nanocode = ">=0.1, <0.2"
features = "all"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lib]
doctest = false
